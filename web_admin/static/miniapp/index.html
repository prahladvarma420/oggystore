<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>%%STORE%%</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/miniapp/style.css">
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <main id="app">
    <!-- Welcome card -->
    <section class="welcome glass">
      <div class="welcome-top">
        <div class="store-badge">🛍️</div>
        <div class="welcome-text">
          <div class="hello">Welcome back, <b id="uname">…</b> 🎖️</div>
          <div class="tag">%%STORE%%</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="k">💰 Balance</span><span class="v" id="ubal">$0.00</span></div>
        <div class="stat"><span class="k">🎖️ Membership</span><span class="v" id="urank">Bronze</span></div>
      </div>
      <div class="sub">Browse the shop, top up your wallet, or invite friends to earn rewards.</div>
    </section>

    <!-- HOME: colored menu -->
    <section id="home" class="menu">
      <button class="cbtn wide c-blue" data-go="shop"><span class="ico">🛍️</span><span>SHOP</span></button>
      <button class="cbtn c-green" data-go="wallet"><span class="ico">💳</span><span>Wallet</span></button>
      <button class="cbtn c-purple" data-go="freebies"><span class="ico">🎁</span><span>Freebies</span></button>
      <button class="cbtn c-cyan" data-go="orders"><span class="ico">📦</span><span>Orders</span></button>
      <button class="cbtn c-teal" data-go="profile"><span class="ico">👤</span><span>Profile</span></button>
      <button class="cbtn c-orange" data-go="refer"><span class="ico">🤝</span><span>Refer &amp; Earn</span></button>
      <button class="cbtn c-blue" data-go="support"><span class="ico">🆘</span><span>Support</span></button>
      <button class="cbtn wide c-red" data-act="clear"><span class="ico">🧹</span><span>Clear Chat</span></button>
    </section>

    <!-- PANEL: dynamic screen -->
    <section id="panel" class="panel glass hidden">
      <div class="panel-head">
        <button class="back" id="backBtn">‹ Back</button>
        <h2 id="panelTitle">Title</h2>
      </div>
      <div id="panelBody"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/static/miniapp/app.js"></script>
</body>
</html>
