<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="%%CSRF%%">
<meta name="admin-role" content="%%ROLE%%">
<title>%%STORE%% · Admin</title>
<link rel="stylesheet" href="/static/css/style.css?v=30">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>

<div class="scrim" id="scrim" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar glass">
  <div class="brand">
    %%LOGO_DASH%%
    <div>
      <div class="brand-name neon-title">%%STORE%%</div>
      <div class="brand-sub">Admin Center</div>
    </div>
  </div>
  <nav class="nav" id="nav">
    <div class="nav-label">Overview</div>
    <button class="nav-item active" data-view="dashboard"><i>📊</i><span>Dashboard</span></button>
    <div class="nav-label">Catalog</div>
    <button class="nav-item" data-view="products"><i>📦</i><span>Products &amp; Stock</span></button>
    <button class="nav-item" data-view="restock"><i>📥</i><span>Restock Requests</span></button>
    <div class="nav-label">Sales</div>
    <button class="nav-item" data-view="orders"><i>🛒</i><span>Orders</span></button>
    <button class="nav-item" data-view="users"><i>👥</i><span>Users</span></button>
    <button class="nav-item" data-view="resellers"><i>🤝</i><span>Resellers</span></button>
    <button class="nav-item" data-view="deposits"><i>💳</i><span>Deposits</span></button>
    <button class="nav-item" data-view="withdrawals"><i>💸</i><span>Withdrawals</span></button>
    <button class="nav-item" data-view="profit"><i>📈</i><span>Profit &amp; Cost</span></button>
    <div class="nav-label">Growth &amp; Support</div>
    <button class="nav-item" data-view="coupons"><i>🎟️</i><span>Coupons</span></button>
    <button class="nav-item" data-view="broadcasts"><i>📢</i><span>Broadcasts</span></button>
    <button class="nav-item" data-view="templates"><i>✏️</i><span>Templates</span></button>
    <button class="nav-item" data-view="tickets"><i>🎫</i><span>Support</span></button>
    <div class="nav-label">Financial</div>
    <button class="nav-item" data-view="financial_overview"><i>💰</i><span>Financial Overview</span></button>
    <div class="nav-label">System</div>
    <button class="nav-item" data-view="api_analytics"><i>📡</i><span>API Analytics</span></button>
    <button class="nav-item" data-view="settings"><i>⚙️</i><span>Settings</span></button>
    <button class="nav-item owner-only" data-view="admins"><i>🌍</i><span>Admins</span></button>
    <button class="nav-item owner-only" data-view="logs"><i>🧾</i><span>Logs</span></button>
    <button class="nav-item owner-only" data-view="backups"><i>💾</i><span>Backups</span></button>
    <button class="nav-item" data-view="security"><i>🔐</i><span>Security</span></button>
  </nav>
  <div class="side-foot">
    <div class="bot-pill bot-%%BOT%%">Bot push: %%BOT%%</div>
    <a class="btn btn-ghost btn-block" href="/logout">Logout</a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <header class="topbar glass">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="icon-btn menu-btn" id="menuBtn" title="Menu" aria-label="Open navigation" aria-expanded="false">☰</button>
      <div class="topbar-title" id="viewTitle">Dashboard</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeBtn" title="Switch theme" aria-label="Switch color theme">🎨</button>
      <div class="search-wrap" id="searchWrap" style="display:none">
        <input type="text" id="searchInput" placeholder="Search...">
      </div>
      <button class="btn btn-glow" id="refreshBtn" aria-label="Refresh current view"><span>↻ Refresh</span></button>
      <div class="avatar" title="%%USERNAME%%">%%USERNAME%%</div>
    </div>
  </header>

  <section class="content" id="content">
    <div class="loader"><div class="spinner"></div></div>
  </section>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal glass" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" id="modalClose" aria-label="Close dialog">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="true"></div>

<script src="/static/js/app.js?v=36"></script>
</body>
</html>
