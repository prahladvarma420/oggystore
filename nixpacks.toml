# Railway (Nixpacks) build config.
# Installs headless Chromium + the system libraries Playwright needs for the
# Microsoft 365 Family auto-invite automation (services/m365_family.py).

[phases.setup]
aptPkgs = [
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libatspi2.0-0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2",
    "libpango-1.0-0",
    "libcairo2",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxext6",
    "fonts-liberation",
    "libglib2.0-0",
]

[phases.playwright]
dependsOn = ["install"]
cmds = ["python -m playwright install --with-deps chromium || python -m playwright install chromium"]
