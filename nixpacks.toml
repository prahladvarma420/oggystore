# Railway (Nixpacks) build config.
# Installs headless Chromium + the system libraries Playwright needs for the
# Microsoft 365 Family auto-invite automation (services/m365_family.py).

[phases.setup]
aptPkgs = [
    "libnss3",
    "libnspr4",
    "libatk1.0-0",
    "libatk-bridge2.0-0",
    "libcups2",
    "libdrm2",
    "libxkbcommon0",
    "libatspi2.0-0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm1",
    "libasound2",
    "libpango-1.0-0",
    "libcairo2",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxext6",
    "fonts-liberation",
    "libglib2.0-0",
]

[phases.playwright]
dependsOn = ["install"]
cmds = [
    # Print the resolved version so the build log shows which browser revision
    # is expected, and so this phase's cache key changes when it is edited.
    "python -m playwright --version",
    # Install the Chromium build matching the PINNED playwright in requirements.txt.
    "python -m playwright install --with-deps chromium || python -m playwright install chromium",
    # Playwright >=1.49 launches the separate headless-shell binary by default.
    # On some versions it is NOT covered by `install chromium`, which leaves
    # chromium_headless_shell-<rev> missing at runtime. Harmless where unsupported.
    "python -m playwright install chromium-headless-shell || true",
    # Fail the BUILD (not the running bot) if nothing landed on disk.
    "ls -la /root/.cache/ms-playwright",
]

# Nixpacks only guarantees a custom phase runs if something depends on it.
# Without this, [phases.playwright] can be skipped or cached away entirely.
[phases.build]
dependsOn = ["playwright"]
