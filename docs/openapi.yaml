openapi: 3.1.0
info:
  title: OGGY Reseller API
  version: "1.0"
  description: |
    REST API for OGGY Store resellers: browse the master catalog, import and
    customize products, quote and place wallet-funded orders, retrieve
    deliveries, and receive signed webhook events.

    - Versioning: URL path (`/api/v1`). Every response carries `X-API-Version`.
      See RESELLER_API_VERSIONING.md for the frozen v1 contract.
    - Authentication: `Authorization: Bearer <key_id>.<secret>` on every
      request (including `GET /api/v1`).
    - Envelope: success `{"ok": true, "data": ..., "request_id": ...}`;
      error `{"ok": false, "error": {"code", "message"}, "request_id": ...}`.
    - Timestamps are `YYYY-MM-DD HH:MM:SS` strings. NOTE (v1 quirk):
      order `created_at` is stored in UTC (database default), while
      app-generated fields (`updated_at`, `quoted_at`, webhook timestamps)
      use the shop timezone (default Asia/Kolkata). Always parse as naive
      local strings and compare only within the same field.
    - Money is always a decimal string in USDT ("25.00"). Integer cents or
      floats are never accepted from or exposed to clients.
  contact:
    name: OGGY Store
externalDocs:
  description: Internal WebAdmin Phase 16 operations (separate session/CSRF API, not reseller bearer auth)
  url: ./openapi-webadmin.yaml
servers:
  - url: https://api.ggm25.shop/api/v1
    description: Production
  - url: https://api-staging.example.invalid/api/v1
    description: Staging (test keys only)

tags:
  - name: Catalog
  - name: My Products
  - name: Pricing
  - name: Wallet
  - name: Orders
  - name: Webhooks
  - name: Meta

paths:
  /:
    get:
      tags: [Meta]
      summary: API namespace discovery
      security: [{ApiKeyAuth: []}]
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: {type: string, example: "OGGY Reseller API"}
                          version: {type: string, example: "v1"}
                          status: {type: string, example: "available"}
                          available_resources:
                            type: array
                            items: {type: string}

  /products:
    get:
      tags: [Catalog]
      summary: List products available to you (offset pagination)
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: search, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: availability, in: query, schema: {type: string, enum: [in_stock, out_of_stock]}}
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items: {$ref: "#/components/schemas/CatalogProduct"}
                      meta: {$ref: "#/components/schemas/OffsetPagination"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Get one product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          product: {$ref: "#/components/schemas/CatalogProduct"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /products/{productId}/import:
    post:
      tags: [Catalog]
      summary: Import a product into your catalog (idempotent per product)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "201": {description: Mapping created, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "200": {description: Already imported (idempotent), content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    get:
      tags: [Catalog]
      summary: Check import/mapping status for a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200": {description: Mapping status, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Catalog]
      summary: Remove a product mapping (master product unchanged)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200": {description: Mapping removed, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /my-products:
    get:
      tags: [My Products]
      summary: List your imported products
      description: |
        Backward compatibility: the collection is returned both at
        `data.products` (standard) and top-level `products` (deprecated
        Phase 11 alias, frozen for the life of v1).
      responses:
        "200":
          description: Your catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          products:
                            type: array
                            items: {$ref: "#/components/schemas/MyProduct"}
                      products:
                        type: array
                        deprecated: true
                        items: {$ref: "#/components/schemas/MyProduct"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /my-products/{productId}:
    get:
      tags: [My Products]
      summary: Get one of your product mappings
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Mapping (also mirrored at top level as a deprecated alias)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/MyProduct"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/MyProduct"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [My Products]
      summary: Update your customization fields
      description: Only `custom_name`, `custom_description`, `reseller_sku`, `enabled` are writable. Master-product fields are rejected.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                custom_name: {type: [string, "null"], maxLength: 200}
                custom_description: {type: [string, "null"]}
                reseller_sku: {type: [string, "null"], maxLength: 100}
                enabled: {type: boolean}
      responses:
        "200":
          description: Updated mapping (also mirrored at top level)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/MyProduct"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/MyProduct"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
    delete:
      tags: [My Products]
      summary: Remove the mapping from your catalog
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204": {description: Removed (no body)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /pricing:
    get:
      tags: [Pricing]
      summary: List your effective prices for all accessible products
      description: Collection returned at `data.prices` and (deprecated alias) top-level `prices`.
      responses:
        "200":
          description: Effective prices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          prices:
                            type: array
                            items: {$ref: "#/components/schemas/Price"}
                      prices:
                        type: array
                        deprecated: true
                        items: {$ref: "#/components/schemas/Price"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /pricing/{productId}:
    get:
      tags: [Pricing]
      summary: Get your effective price for one product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Effective price (also mirrored at top level)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - $ref: "#/components/schemas/Price"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/Price"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /balance:
    get:
      tags: [Wallet]
      summary: Get your wallet balance
      description: Accepts no query parameters (any parameter is a 400).
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/Balance"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /wallet/summary:
    get:
      tags: [Wallet]
      summary: Your wallet financial summary (from the immutable ledger)
      description: |
        Read-only aggregation of your own wallet transactions: balance,
        purchases/debits/credits/refunds totals, net spend, transaction
        count.  Analytics never write to the ledger.
      responses:
        "200":
          description: Wallet financial summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wallet: {$ref: "#/components/schemas/WalletSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /usage:
    get:
      tags: [Wallet]
      summary: Your own API usage summary
      description: |
        Reseller-safe self-service visibility: request counts, order counts
        and volume, quota used/remaining, rate-limit hits, webhook health,
        last-activity timestamps.  Contains no IPs, key material, or any
        other reseller's data.
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usage: {$ref: "#/components/schemas/Usage"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /orders:
    post:
      tags: [Orders]
      summary: Create an order (atomic wallet debit + stock reservation)
      description: |
        `product_id`, `quantity`, `client_order_id`, and the conditional `buyer_email` are accepted;
        price, identity, and every server-determined field are rejected
        (400 `invalid_parameter`).  The wallet is debited and the order is
        created in one atomic transaction — a failure rolls both back.

        M365/Canva products require one unit and `buyer_email`: strict ASCII
        dot-atom email, at most 254 characters (local part at most 64).
        Missing email is 422 `buyer_email_required`; malformed/overlong email
        is 400 `invalid_parameter`. A supplied email on other products is
        400 `invalid_parameter` with message `not accepted for this product`.
        Private email must not appear in the public client_order_id (400).
        Orders stay pending until the existing browser invite lane completes.
        Email is encrypted in the existing private invite queue and omitted
        from responses, logs, analytics, exports and webhook payloads.

        Idempotency: reuse the same `client_order_id` for safe retries.
        A replay returns HTTP 200 with `idempotent: true` and the ORIGINAL
        order's stored fields, never a second charge or a new order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderCreateRequest"}
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/OrderCreated"}
        "200":
          description: Idempotent replay of an existing order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/OrderCreated"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "402":
          description: Insufficient wallet balance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
              example: {ok: false, request_id: "c1a2…", error: {code: insufficient_balance, message: "Insufficient wallet balance for this order."}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Idempotency conflict (same key, different financial payload)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
              example: {ok: false, request_id: "9f0e…", error: {code: idempotency_conflict, message: "Wallet reference already used with a different payload."}}
        "422":
          description: Stock/business rule violation, or buyer_email_required for an email-gated product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
              example: {ok: false, request_id: "77ab…", error: {code: insufficient_stock, message: "Only 1 unit(s) available for this product."}}
        "429": {$ref: "#/components/responses/RateLimited"}
        "500": {$ref: "#/components/responses/Internal"}
    get:
      tags: [Orders]
      summary: List your orders (cursor pagination)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after_id, in: query, schema: {type: string, pattern: '^ORD-\d{8}$'}, description: Cursor from meta.pagination.next_after_id}
        - {name: product_id, in: query, schema: {type: string}}
        - {name: client_order_id, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - name: status
          in: query
          description: >-
            Exact shared API status filter. processing means no stored delivery.
            processing and completed return 409 delivery_normalization_required
            until the owner explicitly completes legacy empty-delivery cleanup.
          schema: {type: string, enum: [processing, completed, failed, cancelled]}
      responses:
        "200":
          description: Order page (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items: {$ref: "#/components/schemas/OrderSummary"}
                      meta: {$ref: "#/components/schemas/CursorPagination"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /orders/quote:
    post:
      tags: [Orders]
      summary: Non-binding price quote (no side effects)
      description: Runs the same validation and pricing pipeline as order creation, including required buyer_email for M365/Canva and rejection on other products. Gated quotes add requires_buyer_email true and max_per_order 1. Touches nothing — no stock reservation, invite enqueue, email persistence, wallet movement or quota consumption. Order creation always re-prices authoritatively; a stale quote cannot influence the charged amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: {type: string, pattern: '^PRD-[A-HJ-NP-Z2-9]{12}$'}
                quantity: {type: integer, minimum: 1, maximum: 1000}
                buyer_email:
                  type: string
                  format: email
                  maxLength: 254
                  description: "Required for gated products (quantity 1), forbidden otherwise; same validation/privacy as create. Missing email: 422 buyer_email_required."
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/Quote"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get one of your orders
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order detail (foreign orders return the same 404 as invalid IDs)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: {$ref: "#/components/schemas/OrderDetail"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /orders/{orderId}/delivery:
    get:
      tags: [Orders]
      summary: Retrieve decrypted delivery items for your order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Delivery items (empty list with a status message while pending/failed/cancelled)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          delivery: {$ref: "#/components/schemas/Delivery"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /analytics/sales:
    get:
      tags: [Orders]
      summary: Your sales analytics (from authoritative order + ledger records)
      description: |
        Statuses follow the order lifecycle: completed / pending (awaiting
        fulfillment) / failed / cancelled.  Money: gross sales, refunds by
        kind (full / cancellation / partial), net = gross − refunds.
        Optional inclusive filters: date_from / date_to (YYYY-MM-DD).
      parameters:
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: product_id, in: query, schema: {type: string, pattern: '^PRD-[A-HJ-NP-Z2-9]{12}$'}, description: "Optional drilldown to one of your products (inaccessible products yield zeros — no oracle)"}
      responses:
        "200":
          description: Sales analytics for the authenticated reseller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sales: {$ref: "#/components/schemas/SalesAnalytics"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /refunds:
    get:
      tags: [Refunds]
      summary: List your refund records (cursor pagination)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after_id, in: query, schema: {type: string, pattern: '^REF-[A-HJ-NP-Z2-9]{10}$'}}
        - {name: kind, in: query, schema: {type: string, enum: [full, partial, cancellation, administrative]}}
      responses:
        "200":
          description: Refund records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refunds:
                            type: array
                            items: {$ref: "#/components/schemas/RefundRecord"}
                      meta: {$ref: "#/components/schemas/CursorPagination"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /refunds/{refundId}:
    get:
      tags: [Refunds]
      summary: Get one of your refund records
      parameters: [{name: refundId, in: path, required: true, schema: {type: string, pattern: '^REF-[A-HJ-NP-Z2-9]{10}$'}}]
      responses:
        "200":
          description: Refund record (foreign IDs return the same 404)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refund: {$ref: "#/components/schemas/RefundRecord"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /invoices:
    get:
      tags: [Invoices]
      summary: List your invoices (cursor pagination)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after_id, in: query, schema: {type: string, pattern: '^INV-[A-HJ-NP-Z2-9]{12}$'}}
        - {name: status, in: query, schema: {type: string, enum: [draft, finalized, void]}}
        - {name: date_from, in: query, schema: {type: string, format: date}, description: "invoice overlaps any day on/after this date"}
        - {name: date_to, in: query, schema: {type: string, format: date}, description: "invoice overlaps any day on/before this date"}
        - {name: currency, in: query, schema: {type: string, enum: [USDT]}}
      responses:
        "200":
          description: Invoice page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoices:
                            type: array
                            items: {$ref: "#/components/schemas/Invoice"}
                      meta: {$ref: "#/components/schemas/CursorPagination"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /invoices/{invoiceId}:
    get:
      tags: [Invoices]
      summary: Get one of your invoices
      parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, pattern: '^INV-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Invoice detail (foreign IDs return the same 404)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice: {$ref: "#/components/schemas/Invoice"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /invoices/{invoiceId}/lines:
    get:
      tags: [Invoices]
      summary: Invoice line items
      parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, pattern: '^INV-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Line items with ledger references
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice_id: {type: string}
                          invoice_number: {type: string}
                          currency: {type: string}
                          lines:
                            type: array
                            items: {$ref: "#/components/schemas/InvoiceLine"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /invoices/{invoiceId}/transactions:
    get:
      tags: [Invoices]
      summary: Ledger transactions documented by this invoice
      parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, pattern: '^INV-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Ledger-referenced transactions (own invoice only)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice_id: {type: string}
                          invoice_number: {type: string}
                          currency: {type: string}
                          transactions:
                            type: array
                            items: {$ref: "#/components/schemas/WalletTransaction"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /invoices/{invoiceId}/document:
    get:
      tags: [Invoices]
      summary: Printable invoice document (HTML)
      parameters: [{name: invoiceId, in: path, required: true, schema: {type: string, pattern: '^INV-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Printable HTML invoice (print-to-PDF in any browser)
          content:
            text/html:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /transactions:
    get:
      tags: [Wallet]
      summary: Your ledger transaction history (cursor paginated)
      description: |
        Reads the authoritative immutable wallet ledger — your rows only.
        Filters: type, direction, date_from/date_to (YYYY-MM-DD), order_id
        (ORD-*; includes that order's refunds).  `balance_before` is derived
        as balance_after − amount (exact chain arithmetic); `reference` is
        the idempotency identity.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: after, in: query, schema: {type: string}, description: "opaque cursor from meta.pagination.next_after"}
        - {name: type, in: query, schema: {type: string, enum: [topup_credit, purchase_debit, refund_credit, adjustment_credit, adjustment_debit]}}
        - {name: direction, in: query, schema: {type: string, enum: [debit, credit]}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: order_id, in: query, schema: {type: string, pattern: '^ORD-\d{8}$'}}
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          transactions:
                            type: array
                            items: {$ref: "#/components/schemas/WalletTransaction"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /statements:
    get:
      tags: [Statements]
      summary: List your statements (cursor pagination)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: after_id, in: query, schema: {type: string, pattern: '^STMT-[A-HJ-NP-Z2-9]{12}$'}}
        - {name: status, in: query, schema: {type: string, enum: [open, finalized]}}
        - {name: period_type, in: query, schema: {type: string, enum: [monthly, weekly, custom, invoice]}}
        - {name: date_from, in: query, schema: {type: string, format: date}, description: "statement overlaps any day on/after this date"}
        - {name: date_to, in: query, schema: {type: string, format: date}, description: "statement overlaps any day on/before this date"}
        - {name: currency, in: query, schema: {type: string, enum: [USDT]}}
      responses:
        "200":
          description: Statement page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          statements:
                            type: array
                            items: {$ref: "#/components/schemas/Statement"}
                      meta: {$ref: "#/components/schemas/CursorPagination"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /statements/{statementId}:
    get:
      tags: [Statements]
      summary: Get one of your statements (with invoice reconciliation)
      parameters: [{name: statementId, in: path, required: true, schema: {type: string, pattern: '^STMT-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Statement detail (foreign IDs return the same 404)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          statement: {$ref: "#/components/schemas/Statement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /statements/{statementId}/transactions:
    get:
      tags: [Statements]
      summary: Statement transactions (ledger-referenced, paginated)
      parameters:
        - {name: statementId, in: path, required: true, schema: {type: string, pattern: '^STMT-[A-HJ-NP-Z2-9]{12}$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: after_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: Chronological lines with running balances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          statement_id: {type: string}
                          statement_number: {type: string}
                          currency: {type: string}
                          transactions:
                            type: array
                            items: {$ref: "#/components/schemas/StatementLine"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /statements/{statementId}/invoices:
    get:
      tags: [Statements]
      summary: Invoices related to the statement period
      parameters: [{name: statementId, in: path, required: true, schema: {type: string, pattern: '^STMT-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200": {description: Related invoices, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /statements/{statementId}/document:
    get:
      tags: [Statements]
      summary: Printable statement document (HTML)
      parameters: [{name: statementId, in: path, required: true, schema: {type: string, pattern: '^STMT-[A-HJ-NP-Z2-9]{12}$'}}]
      responses:
        "200":
          description: Printable HTML statement
          content:
            text/html:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /exports/orders.csv:
    get:
      tags: [Orders]
      summary: Export your orders as CSV
      description: |
        Streams your own orders as CSV (max 100k rows).  Contains only
        reseller-safe fields — never delivery content or internal ids.
        Optional inclusive date filters: date_from / date_to (YYYY-MM-DD).
      parameters:
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: CSV attachment
          content:
            text/csv:
              schema: {type: string}
              example: "order_id,product_id,product_name,quantity,unit_price,total,currency,status,delivery_status,client_order_id,created_at,updated_at,refunded,refund_total"
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /webhooks:
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, format: uri, description: "HTTPS only; SSRF-validated"}
                events:
                  type: array
                  items: {$ref: "#/components/schemas/SubscriptionEventType"}
                  description: Defaults to all supported events; [] subscribes to none
                enabled: {type: boolean, default: true}
      responses:
        "201":
          description: Webhook created — the signing secret is shown exactly once
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          webhook: {$ref: "#/components/schemas/WebhookWithSecret"}
                          supported_events:
                            type: array
                            items: {$ref: "#/components/schemas/SubscriptionEventType"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      tags: [Webhooks]
      summary: List your webhooks (secrets never included)
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          webhooks:
                            type: array
                            items: {$ref: "#/components/schemas/Webhook"}
                          count: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /webhooks/analytics:
    get:
      tags: [Webhooks]
      summary: Your webhook delivery analytics
      description: |
        Aggregated from the delivery outbox and attempt log for YOUR
        webhooks only: events by status, attempts, retries, HTTP status
        distribution, average delivery latency (seconds).  No payloads,
        no secrets.
      responses:
        "200":
          description: Webhook analytics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          webhooks: {$ref: "#/components/schemas/WebhookAnalytics"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /webhooks/{webhookId}:
    get:
      tags: [Webhooks]
      summary: Get one webhook
      parameters: [{name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}]
      responses:
        "200": {description: Webhook, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [Webhooks]
      summary: Update url / enabled / events (secret is NOT patchable)
      parameters: [{name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string, format: uri}
                enabled: {type: boolean}
                events: {type: array, items: {$ref: "#/components/schemas/SubscriptionEventType"}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      parameters: [{name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}]
      responses:
        "204": {description: Deleted (no body)}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /webhooks/{webhookId}/test:
    post:
      tags: [Webhooks]
      summary: Send a signed synthetic test.ping event (integration testing)
      description: |
        Delivers a signed `test.ping` payload to YOUR registered webhook URL
        synchronously — the same HMAC scheme and headers as real events —
        so you can verify your handler end to end without placing an order.
        Creates no order, stock, wallet, or outbox state.  In the sandbox
        environment the ping carries `"environment": "test"`.
      parameters: [{name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}]
      responses:
        "200":
          description: Delivery outcome (delivered=false means your endpoint was unreachable or errored)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          test:
                            type: object
                            properties:
                              webhook_id: {type: string}
                              event_type: {type: string, enum: [test.ping]}
                              delivered: {type: boolean}
                              http_status: {type: [integer, "null"]}
                              error_category: {type: [string, "null"]}
                              elapsed_ms: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /webhooks/{webhookId}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret (new secret shown once)
      parameters: [{name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}]
      responses:
        "200": {description: Rotated, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      summary: List delivery attempts for a webhook (newest first)
      parameters:
        - {name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Delivery log, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    post:
      tags: [Webhooks]
      summary: Manually retry one failed delivery
      parameters:
        - {name: webhookId, in: path, required: true, schema: {type: string, pattern: '^WHK-\d{8}$'}}
        - {name: deliveryId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Retry scheduled, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}

  /webhooks/events/{eventId}/retry:
    post:
      tags: [Webhooks]
      summary: Re-queue a dead-lettered event for delivery
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Event re-queued, content: {application/json: {schema: {$ref: "#/components/schemas/Envelope"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "<key_id>.<secret> (e.g. rk_test_XXXX.sk_test_YYYY)"

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: string, pattern: '^PRD-[A-HJ-NP-Z2-9]{12}$'}
      example: PRD-G9EPY76H37ML
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, pattern: '^ORD-\d{8}$'}
      example: ORD-00000042

  schemas:
    Envelope:
      type: object
      required: [ok, data, request_id]
      properties:
        ok: {type: boolean, enum: [true]}
        data: {type: object}
        request_id: {type: string, example: "6f728acd49354208b3935b82f46157fe"}
        meta: {type: object}
    ErrorEnvelope:
      type: object
      required: [ok, error, request_id]
      properties:
        ok: {type: boolean, enum: [false]}
        request_id: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: "product_not_found"}
            message: {type: string, example: "The requested product was not found."}
    OffsetPagination:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page: {type: integer}
            limit: {type: integer}
            total: {type: integer}
            pages: {type: integer}
            has_next: {type: boolean}
            has_previous: {type: boolean}
    CursorPagination:
      type: object
      properties:
        pagination:
          type: object
          properties:
            has_more: {type: boolean}
            next_after_id: {type: [string, "null"], example: "ORD-00000041"}
    CatalogProduct:
      type: object
      properties:
        id: {type: string, example: "PRD-G9EPY76H37ML", description: "Public product ID (field name is 'id' here)"}
        name: {type: string}
        price: {type: string, example: "25.00"}
        currency: {type: string, enum: [USDT]}
        availability: {type: string, enum: [in_stock, out_of_stock]}
        available_quantity: {type: integer}
        max_per_order: {type: integer}
        status: {type: string, example: active}
        category: {type: [string, "null"]}
        description: {type: string}
        featured: {type: boolean}
        validity: {type: string}
        warranty: {type: string}
    MyProduct:
      type: object
      properties:
        product_id: {type: string, example: "PRD-G9EPY76H37ML"}
        custom_name: {type: [string, "null"]}
        custom_description: {type: [string, "null"]}
        reseller_sku: {type: [string, "null"]}
        enabled: {type: boolean}
        imported_at: {type: string, example: "2026-10-06 15:23:38"}
        updated_at: {type: string}
        master_name: {type: string}
        master_active: {type: boolean}
        access_enabled: {type: boolean}
        price: {type: string, example: "25.00"}
        currency: {type: string, enum: [USDT]}
        availability: {type: string}
        category: {type: [string, "null"]}
    Price:
      type: object
      properties:
        product_id: {type: string, example: "PRD-G9EPY76H37ML"}
        name: {type: string}
        price: {type: string, example: "25.00"}
        currency: {type: string, enum: [USDT]}
        price_source: {type: string, example: "master", description: "master | master_tier | rule:*"}
    Balance:
      type: object
      required: [balance, currency]
      properties:
        balance: {type: string, example: "1000.00"}
        currency: {type: string, enum: [USDT]}
    OrderCreateRequest:
      type: object
      required: [product_id, quantity]
      additionalProperties: false
      properties:
        product_id: {type: string, pattern: '^PRD-[A-HJ-NP-Z2-9]{12}$'}
        quantity: {type: integer, minimum: 1, maximum: 1000}
        buyer_email:
          type: string
          format: email
          maxLength: 254
          description: "Required for M365/Canva products, forbidden otherwise. Strict ASCII dot-atom email, local part <=64; no spaces/display names/quoted local parts/SMTPUTF8. Email-gated quantity must be 1. Never returned or logged; encrypted in existing invite queue."
        client_order_id:
          type: string
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
          description: "Your idempotency key. Reusing it returns the original order (200, idempotent: true)."
    OrderCreated:
      type: object
      properties:
        order_id: {type: string, example: "ORD-00000042"}
        product_id: {type: string, example: "PRD-G9EPY76H37ML"}
        quantity: {type: integer, example: 2}
        unit_price: {type: string, example: "25.00"}
        total: {type: string, example: "50.00"}
        currency: {type: string, enum: [USDT]}
        status: {type: string, enum: [processing, completed, failed, cancelled, replaced, warranty_review]}
        delivery_status: {type: string, enum: [pending, delivered, failed]}
        fulfillment:
          type: object
          description: "Present only on HTTP 201 creation, not idempotent HTTP 200 replays. Never contains supplier configuration."
          properties:
            type: {type: string, enum: [code_stock, manual, external_api, supplier_api]}
            status: {type: string, enum: [fulfilled, pending, terminal_error]}
        created_at: {type: string, example: "2026-10-06 15:23:38", description: "Stored in UTC (v1 quirk)"}
        client_order_id: {type: string}
        idempotent: {type: boolean, description: "Present and true on idempotent replays (HTTP 200)"}
    OrderSummary:
      type: object
      properties:
        order_id: {type: string}
        product_id: {type: string}
        quantity: {type: integer}
        unit_price: {type: string}
        total: {type: string}
        currency: {type: string}
        status: {type: string, enum: [processing, completed, failed, cancelled, replaced, warranty_review]}
        delivery_status: {type: string, enum: [pending, delivered, failed]}
        client_order_id: {type: [string, "null"]}
        created_at: {type: string}
        updated_at: {type: string}
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            refunded: {type: boolean}
            refund:
              type: object
              description: "Present when refunded"
              properties:
                total: {type: string, example: "50.00"}
                currency: {type: string, enum: [USDT]}
                type: {type: string, enum: [full, cancellation, partial, mixed]}
                refunded_at: {type: string}
    Quote:
      type: object
      properties:
        requires_buyer_email:
          type: boolean
          const: true
          description: "Present only for M365/Canva gated products; omitted for other products. Quotes still require the email and never enqueue or persist it."
        product_id: {type: string}
        quantity: {type: integer}
        unit_price: {type: string}
        total: {type: string}
        currency: {type: string, enum: [USDT]}
        price_source: {type: string}
        max_per_order: {type: integer}
        available_quantity: {type: integer}
        in_stock: {type: boolean}
        wallet_balance: {type: string, example: "1000.00"}
        sufficient_funds: {type: boolean}
        quoted_at: {type: string, description: "Shop-timezone timestamp"}
    Delivery:
      type: object
      properties:
        order_id: {type: string}
        delivery_status: {type: string, enum: [pending, delivered, failed, cancelled]}
        items:
          type: array
          items: {type: string}
          description: "Decrypted delivery content (codes/accounts). Empty when pending/failed/cancelled."
        message: {type: string, description: "Present for non-delivered states"}
    Invoice:
      type: object
      properties:
        invoice_id: {type: string, example: "INV-ABC123XY4567"}
        invoice_number: {type: string, example: "INV-2026-000042"}
        status: {type: string, enum: [draft, finalized, void]}
        currency: {type: string, enum: [USDT]}
        billing_period:
          type: object
          properties:
            start: {type: string, format: date}
            end: {type: string, format: date}
        subtotal: {type: string, example: "250.00"}
        refunds: {type: string}
        adjustment_credits: {type: string}
        adjustment_debits: {type: string}
        topups: {type: string, description: "informational wallet funding in the period"}
        total: {type: string}
        amount_paid: {type: string, description: "prepaid model: settled at order time"}
        amount_due: {type: string}
        orders_count: {type: integer}
        transactions_count: {type: integer}
        issued_at: {type: string}
        finalized_at: {type: [string, "null"]}
        voided_at: {type: [string, "null"]}
    InvoiceLine:
      type: object
      properties:
        type: {type: string, enum: [purchase, refund_full, refund_cancellation, refund_partial, adjustment_credit, adjustment_debit, topup]}
        label: {type: string}
        description: {type: string}
        reference: {type: string, description: "ledger idempotency reference"}
        order_id: {type: [string, "null"], example: "ORD-00000042"}
        product_id: {type: [string, "null"]}
        quantity: {type: integer}
        unit_amount: {type: string}
        total: {type: string}
        currency: {type: string}
        created_at: {type: string}
    RefundRecord:
      type: object
      properties:
        refund_id: {type: string, example: "REF-ABC123XY45"}
        order_id: {type: string, example: "ORD-00000042"}
        kind: {type: string, enum: [full, partial, cancellation, administrative]}
        amount: {type: string, example: "10.00"}
        currency: {type: string, enum: [USDT]}
        reason: {type: string}
        source: {type: string, enum: [system_failure, cancellation, admin]}
        status: {type: string, enum: [completed]}
        reference: {type: string, description: "ledger idempotency reference"}
        created_at: {type: string}
    WalletTransaction:
      type: object
      properties:
        reference: {type: string, example: "rapi.12.9f2a-…"}
        type: {type: string, enum: [topup_credit, purchase_debit, refund_credit, adjustment_credit, adjustment_debit]}
        direction: {type: string, enum: [debit, credit]}
        amount: {type: string, example: "10.00"}
        currency: {type: string, enum: [USDT]}
        balance_before: {type: string, description: "derived: balance_after − amount"}
        balance_after: {type: string, description: "authoritative, from the ledger"}
        order_id: {type: [string, "null"], example: "ORD-00000042"}
        description: {type: string}
        created_at: {type: string}
    Statement:
      type: object
      properties:
        statement_id: {type: string, example: "STMT-ABC123XY4567"}
        statement_number: {type: string, example: "ST-2026-000007"}
        status: {type: string, enum: [open, finalized]}
        currency: {type: string, enum: [USDT]}
        period_type: {type: string, enum: [monthly, weekly, custom, invoice]}
        period:
          type: object
          properties:
            start: {type: string, description: "inclusive lower bound (shop time)"}
            end: {type: string, description: "EXCLUSIVE upper bound (half-open)"}
            half_open: {type: boolean}
            timezone: {type: string}
        opening_balance: {type: string, example: "500.00"}
        closing_balance: {type: string}
        total_credits: {type: string}
        total_debits: {type: string}
        purchases: {type: string}
        refunds: {type: string}
        adjustment_credits: {type: string}
        adjustment_debits: {type: string}
        topups: {type: string}
        orders_count: {type: integer}
        transactions_count: {type: integer}
        invoice_ids: {type: array, items: {type: string}}
        generated_at: {type: string}
        finalized_at: {type: [string, "null"]}
    StatementLine:
      type: object
      properties:
        date: {type: string}
        type: {type: string, example: "purchase_debit"}
        label: {type: string}
        direction: {type: string, enum: [debit, credit]}
        amount: {type: string}
        balance_after: {type: string, description: "authoritative running balance from the ledger"}
        reference: {type: string}
        order_id: {type: [string, "null"]}
        description: {type: string}
        currency: {type: string}
    WalletSummary:
      type: object
      properties:
        balance: {type: string, example: "970.00"}
        currency: {type: string, enum: [USDT]}
        transaction_count: {type: integer}
        total_purchases: {type: string, example: "50.00"}
        purchase_count: {type: integer}
        total_debits: {type: string}
        total_credits: {type: string}
        refunds: {type: string}
        refund_count: {type: integer}
        net_spend: {type: string, description: "purchases minus refunds"}
    Usage:
      type: object
      properties:
        requests:
          type: object
          properties:
            total: {type: integer}
            successful: {type: integer}
            failed: {type: integer}
            today: {type: integer}
        orders:
          type: object
          properties:
            total: {type: integer}
            today: {type: integer}
            this_month: {type: integer}
            volume: {type: string, example: "150.00"}
            currency: {type: string, enum: [USDT]}
        quota:
          type: object
          properties:
            daily_limit: {type: [integer, "null"], description: "null = unlimited"}
            daily_used: {type: integer}
            daily_remaining: {type: [integer, "null"]}
            monthly_limit: {type: [integer, "null"]}
            monthly_used: {type: integer}
            monthly_remaining: {type: [integer, "null"]}
        rate_limits:
          type: object
          properties:
            limited_requests: {type: integer}
        webhooks:
          type: object
          properties:
            configured: {type: integer}
            enabled: {type: integer}
            failed_deliveries: {type: integer}
            dead_lettered_events: {type: integer}
        endpoints:
          type: array
          description: "Own per-endpoint breakdown, last 30 days"
          items:
            type: object
            properties:
              endpoint: {type: string, example: "/api/v1/orders"}
              method: {type: string, example: "POST"}
              requests: {type: integer}
              successful: {type: integer}
              failed: {type: integer}
              avg_ms: {type: number}
        keys:
          type: array
          description: "Own per-API-key request counts (public key ids only)"
          items:
            type: object
            properties:
              key_id: {type: string, example: "rk_test_ABC123XY"}
              requests: {type: integer}
              errors: {type: integer}
              last_used_at: {type: [string, "null"]}
        activity:
          type: object
          properties:
            last_request_at: {type: [string, "null"]}
            last_key_used_at: {type: [string, "null"]}
    SalesAnalytics:
      type: object
      properties:
        orders_total: {type: integer}
        completed: {type: integer}
        pending: {type: integer, description: "awaiting fulfillment (manual products)"}
        failed: {type: integer}
        cancelled: {type: integer}
        refunded_orders: {type: integer}
        quantity_sold: {type: integer}
        gross_sales: {type: string, example: "250.00"}
        completed_sales: {type: string}
        net_sales: {type: string, description: "gross minus all refunds"}
        refunds_total: {type: string}
        avg_order_value: {type: string}
        currency: {type: string, enum: [USDT]}
        top_products:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              orders: {type: integer}
              units: {type: integer}
              gross_sales: {type: string}
        orders_by_date:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              orders: {type: integer}
              gross_sales: {type: string}
    EventType:
      description: "Delivered event types; test.ping is produced only by POST /webhooks/{webhook_id}/test, not a subscription option."
      type: string
      enum:
        - order.created
        - order.failed
        - order.cancelled
        - delivery.pending
        - delivery.completed
        - delivery.failed
        - refund.created
        - product.updated
        - product.disabled
        - product.enabled
        - product.deleted
        - stock.updated
        - test.ping
    SubscriptionEventType:
      type: string
      enum:
        - order.created
        - order.failed
        - order.cancelled
        - delivery.pending
        - delivery.completed
        - delivery.failed
        - refund.created
        - product.updated
        - product.disabled
        - product.enabled
        - product.deleted
        - stock.updated
    Webhook:
      type: object
      properties:
        webhook_id: {type: string, example: "WHK-00000001"}
        url: {type: string, format: uri}
        enabled: {type: boolean}
        events: {type: array, items: {$ref: "#/components/schemas/SubscriptionEventType"}}
        created_at: {type: string}
        updated_at: {type: string}
    WebhookAnalytics:
      type: object
      properties:
        window_days: {type: integer}
        events_total: {type: integer}
        delivered: {type: integer}
        pending: {type: integer}
        dead_lettered: {type: integer}
        events_retried: {type: integer}
        avg_delivery_seconds: {type: [number, "null"]}
        by_event_type: {type: object, additionalProperties: {type: integer}}
        delivery_attempts: {type: integer}
        attempts_succeeded: {type: integer}
        attempts_failed: {type: integer}
        retry_attempts: {type: integer}
        http_status_distribution:
          type: object
          additionalProperties: {type: integer}
          example: {"200": 12, "500": 1, "no_response": 2}
        webhooks_configured: {type: integer}
        webhooks_enabled: {type: integer}
    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            secret: {type: string, description: "Plaintext signing secret — shown exactly once at creation/rotation"}
            secret_note: {type: string}

  responses:
    Unauthorized:
      description: Missing/invalid/revoked credentials (uniform — no oracle)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example: {ok: false, request_id: "ab12…", error: {code: authentication_failed, message: "Authentication credentials are missing or invalid."}}
    NotFound:
      description: Not found (foreign resources return the identical shape)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example: {ok: false, request_id: "cd34…", error: {code: order_not_found, message: "Order not found."}}
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example: {ok: false, request_id: "ef56…", error: {code: invalid_quantity, message: "quantity must be greater than zero."}}
    Unprocessable:
      description: Business rule violation (stock, product type, fields)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    RateLimited:
      description: Rate limit or quota exceeded. Headers include RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset, Retry-After.
      headers:
        RateLimit-Limit: {schema: {type: integer}}
        RateLimit-Remaining: {schema: {type: integer}}
        RateLimit-Reset: {schema: {type: integer}}
        Retry-After: {schema: {type: integer}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            rate_limit:
              value: {ok: false, request_id: "12ab…", error: {code: rate_limit_exceeded, message: "Too many requests for this operation type."}}
            quota:
              value: {ok: false, request_id: "34cd…", error: {code: daily_order_quota_exceeded, message: "Daily order quota (500) reached. Your quota resets at midnight UTC."}}
    Internal:
      description: Unexpected error — sanitized, never contains internals
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          example: {ok: false, request_id: "56ef…", error: {code: internal_error, message: "An unexpected error occurred."}}

security:
  - ApiKeyAuth: []
